name: Upload IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload to App Store Connect
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # 1. Create the required fastlane directory
          mkdir -p fastlane
          
          # 2. Reconstruct the Fastfile INSIDE the new directory
          cat <<EOF > fastlane/Fastfile
          lane :upload_app do
            app_store_connect_api_key(
              key_id: ENV["KEY_ID"],
              issuer_id: ENV["ISSUER_ID"],
              key_content: ENV["PRIVATE_KEY"],
              in_house: false
            )
            
            upload_to_testflight(
              ipa: ENV["GITHUB_WORKSPACE"] + "/App.ipa",
              skip_submission: true,
              skip_waiting_for_build_processing: true
            )
          end
          EOF
          
          # 3. Execute the Fastlane script
          fastlane upload_app
